name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mars-site/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Create the Pages site when this repository has not enabled it yet.
          enablement: true

      # A Pages site that is still configured to "Deploy from a branch" ignores
      # the artifact below and serves the repository root instead (which has no
      # index.html). Keep the repository setting aligned with this workflow so a
      # stale Pages setting cannot result in GitHub's generic 404 page.
      - name: Use GitHub Actions as the Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow

      - name: Install dependencies
        working-directory: mars-site
        run: npm ci

      - name: Build
        working-directory: mars-site
        run: npm run build

      # The Vite project lives below the repository root, so its build does not
      # automatically include the repository-level custom-domain declaration.
      - name: Add custom domain to build
        run: cp CNAME mars-site/dist/CNAME

      - name: Verify Pages artifact
        run: |
          test -f mars-site/dist/index.html
          test "$(cat mars-site/dist/CNAME)" = "$(cat CNAME)"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: mars-site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
