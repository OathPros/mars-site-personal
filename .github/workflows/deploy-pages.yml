name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p "$RUNNER_TEMP/pages"
          cp index.html favicon.svg knight-inspired.png "QRCode for Join the MARS pilot testing fleet!.png" CNAME "$RUNNER_TEMP/pages/"

      - name: Verify Pages artifact
        run: |
          test -s "$RUNNER_TEMP/pages/index.html"
          test -s "$RUNNER_TEMP/pages/favicon.svg"
          test -s "$RUNNER_TEMP/pages/QRCode for Join the MARS pilot testing fleet!.png"
          test "$(cat "$RUNNER_TEMP/pages/CNAME")" = "lukegagliardi.ca"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
